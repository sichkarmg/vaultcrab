version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
    open-pull-requests-limit: 5
    ignore:
      # replaced by the patched forks in third_party/ (see go.mod); update
      # those by hand together with their PATCHES.md
      - dependency-name: github.com/charmbracelet/bubbletea
      - dependency-name: github.com/charmbracelet/ultraviolet
      - dependency-name: github.com/charmbracelet/x/vt

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
