name: release

# A v* tag builds the binaries and creates a DRAFT pre-release with archives
# and checksums.txt (see .goreleaser.yaml and RELEASING.md). Publishing the
# draft is a manual step after scripts/release-verify.sh.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the draft release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Tag matches the version in code
        run: |
          code=$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/vaultcrab/main.go)
          [ "v$code" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, code $code"; exit 1; }
      - name: go test
        run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
